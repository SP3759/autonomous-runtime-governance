version: "3.9"

# ARG Financial Circuit Breaker -- Local Development Environment
# Provides a local Kafka + Zookeeper stack for running the simulation
# without cloud credentials.
#
# Azure Event Hubs equivalent config: config/sidecar-proxy/eventhubs-pipeline.yaml
#
# Usage:
#   docker-compose up -d
#   python src/agent_simulator.py --kafka
#   docker-compose down

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: arg-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: arg-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 2592000000   # 30 days
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Schema Registry -- validates event payloads against ARG schemas
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: arg-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # Topic initializer -- creates ARG topics with correct partition config
  # Runs once then exits.
  topic-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: arg-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic arg.telemetry.events \
        --partitions 12 \
        --replication-factor 1 \
        --config retention.ms=2592000000 &&
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic arg.circuit_breaker.fired \
        --partitions 3 \
        --replication-factor 1 &&
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic arg.wallet.lifecycle \
        --partitions 6 \
        --replication-factor 1
      echo 'ARG topics created.'
      "
    restart: "no"
