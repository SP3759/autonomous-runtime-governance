[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "arg-kms-signing"
version = "1.0.0"
description = "ARG KMS signing — protocol and LocalECSigner/Azure/AWS implementations"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
azure = [
    "azure-keyvault-keys>=4.9.0",
    "azure-identity>=1.17.0",
]
aws = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
